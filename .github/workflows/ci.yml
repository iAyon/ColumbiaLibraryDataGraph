name: CI Pipeline - Columbia Library Data Graph

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Knowledge Graph Ingestion & Exporter
      run: |
        python src/ingest_metadata.py
        python src/export_opencypher.py

    - name: Run Unit Tests
      run: |
        python -m unittest tests/test_graph_rag.py
